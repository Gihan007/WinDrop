name: Build Windows app

on:
  push:
    tags: ["v*"]        # pushing a tag like v1.0.0 builds and publishes a release
  workflow_dispatch:     # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.10.0

      - name: Build WinDrop.exe
        run: pyinstaller --noconfirm --onefile --windowed --name WinDrop --icon assets/icon.ico --add-data "assets/icon.ico;assets" src/app.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = "1.0.0"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          & $iscc "/DAppVersion=$v" installer\windrop.iss

      - uses: actions/upload-artifact@v4
        with:
          name: WinDrop-windows
          path: |
            dist/WinDrop.exe
            dist/WinDrop-Setup.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinDrop-Setup.exe
            dist/WinDrop.exe
