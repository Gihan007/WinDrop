name: Build Windows app

on:
  push:
    tags: ["v*"]        # pushing a tag like v1.0.0 builds and publishes a release
  workflow_dispatch:     # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.10.0

      - name: Download aria2 (torrent engine)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" -OutFile aria2.zip
          $expected = "67D015301EEF0B612191212D564C5BB0A14B5B9C4796B76454276A4D28D9B288"
          $actual = (Get-FileHash aria2.zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "aria2 download failed its integrity check ($actual)" }
          Expand-Archive aria2.zip -DestinationPath aria2tmp
          New-Item -ItemType Directory -Force vendor/aria2 | Out-Null
          Get-ChildItem aria2tmp -Recurse -Include aria2c.exe,COPYING,LICENSE.OpenSSL | Copy-Item -Destination vendor/aria2

      - name: Download croc (far transfers)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/schollz/croc/releases/download/v10.7.0/croc_v10.7.0_Windows-64bit.zip" -OutFile croc.zip
          $expected = "0EB2755CE9E73C172EC306167F3274C11B6D96DE10F71A13ABC7C0A2DB7CD26A"
          $actual = (Get-FileHash croc.zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "croc download failed its integrity check ($actual)" }
          Expand-Archive croc.zip -DestinationPath croctmp
          New-Item -ItemType Directory -Force vendor/croc | Out-Null
          Copy-Item croctmp/croc.exe, croctmp/LICENSE -Destination vendor/croc

      - name: Build WinDrop.exe
        run: pyinstaller --noconfirm --onefile --windowed --name WinDrop --icon assets/icon.ico --add-data "assets/icon.ico;assets" --add-data "vendor/aria2;aria2" --add-data "vendor/croc;croc" src/app.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = "1.0.0"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          & $iscc "/DAppVersion=$v" installer\windrop.iss

      - name: Build Microsoft Store package (MSIX)
        shell: pwsh
        run: |
          # Store edition: folder build (no torrent engine), packaged as MSIX. Microsoft signs it on upload.
          pyinstaller --noconfirm --onedir --windowed --name WinDrop --icon assets/icon.ico `
            --add-data "assets/icon.ico;assets" --add-data "vendor/croc;croc" --distpath storebuild --workpath build-store src/app.py
          $v = "1.0.0"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          New-Item -ItemType Directory -Force msix | Out-Null
          Copy-Item storebuild/WinDrop msix/WinDrop -Recurse
          Copy-Item store/Assets msix/Assets -Recurse
          (Get-Content store/AppxManifest.xml -Raw).Replace("__VERSION__", "$v.0") | Set-Content msix/AppxManifest.xml -Encoding utf8
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found" }
          & $makeappx.FullName pack /d msix /p "dist/WinDropX-$v.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          Compress-Archive -Path msix/* -DestinationPath "dist/WinDropX-$v-test-layout.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: WinDropX-Microsoft-Store
          path: |
            dist/WinDropX-*.msix
            dist/WinDropX-*-test-layout.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WinDrop-windows
          path: |
            dist/WinDrop.exe
            dist/WinDrop-Setup.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinDrop-Setup.exe
            dist/WinDrop.exe
